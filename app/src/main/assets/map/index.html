<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https://tile.openstreetmap.org data:; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="leaflet.css">
  <link rel="stylesheet" href="picker.css">
  <title>Choose a location</title>
</head>
<body>
  <div id="map" aria-label="Location map. Tap to place the pin, drag to pan, or pinch to zoom."></div>
  <div id="map-status" role="status" hidden>Map images could not load. Check your connection, then tap Retry map.</div>
  <script src="leaflet.js"></script>
  <script src="picker.js"></script>
</body>
</html>
