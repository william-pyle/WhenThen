name: Android build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "platform-tools"'
      - name: Build and test
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug assembleRelease -PciUnsignedRelease=true --build-cache --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk
          python tests/test-package-release.py
          python -m unittest discover -s tests -p 'test_workflow*.py'
      - name: Record release candidate provenance
        if: github.repository == 'william-pyle/WhenThen' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python scripts/ci_artifact.py create
      - name: Retain immutable release candidate
        if: github.repository == 'william-pyle/WhenThen' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
