name: Release APK
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to retry (for example v1.0.2)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'william-pyle/WhenThen' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate release version
        run: python scripts/prepare-release.py "$RELEASE_TAG"
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Run tests before signing
        run: |
          ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest --no-daemon
          python tests/test-package-release.py
      - name: Prepare private signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os, pathlib
          value = os.environ.get('ANDROID_KEYSTORE_BASE64', '')
          if not value: raise SystemExit('Missing ANDROID_KEYSTORE_BASE64 repository secret.')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'whenthen-release.p12'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('ANDROID_KEYSTORE_PATH=' + str(path) + '\n')
          PY
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          python scripts/package-release.py
      - name: Upload release files
        run: |
          gh release upload "$RELEASE_TAG" dist/WhenThen.apk dist/*-source.zip dist/checksums.json --clobber
          gh release upload "$RELEASE_TAG" dist/update.json
      - name: Remove private signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/whenthen-release.p12"
